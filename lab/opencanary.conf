{
  "device.node_id": "decoy-01",
  "ip.ignorelist": [],
  "logtype.ignorelist": [],
  "http.enabled": true,
  "http.port": 8080,
  "http.banner": "Data Center Archive",
  "http.skin": "basicLogin",
  "ftp.enabled": false,
  "https.enabled": false,
  "ssh.enabled": false,
  "smb.enabled": false,
  "portscan.enabled": false,
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {"plain": {"format": "%(message)s"}},
      "handlers": {
        "console": {"class": "logging.StreamHandler", "stream": "ext://sys.stdout"},
        "file": {"class": "logging.FileHandler", "filename": "/evidence/events.jsonl", "formatter": "plain"}
      }
    }
  }
}
