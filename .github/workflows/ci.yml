name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Fast tests (classical, data, metrics, CLI)
        run: pytest -m "not slow" --cov=qdc_anomaly --cov-report=term-missing
      - name: Quantum tests
        run: pytest -m slow

  smoke-benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Tiny end to end benchmark including both quantum detectors
        run: |
          qdc benchmark --quiet --out results-ci \
            --set data.n_racks=3 --set data.n_steps=400 \
            --set benchmark.n_train=40 --set benchmark.n_test=80 \
            --set benchmark.seeds=[0] --set quantum.epochs=3
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-benchmark-report
          path: results-ci/
