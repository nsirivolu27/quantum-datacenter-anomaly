[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdc-anomaly"
version = "0.1.0"
description = "Quantum and classical anomaly detection for data center telemetry, built as a study repository"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["quantum", "pennylane", "anomaly-detection", "data-center", "telemetry", "qml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pennylane>=0.36",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
aws = [
    "boto3>=1.34",
]
plots = [
    "matplotlib>=3.8",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[project.scripts]
qdc = "qdc_anomaly.cli:main"

[project.urls]
Documentation = "docs/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qdc_anomaly = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that run quantum circuits and take longer than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qdc_anomaly"]
